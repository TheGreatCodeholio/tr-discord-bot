# trunk-recorder Discord watchdog bot — copy to config.yaml and edit.
#
# The bot runs on the same host as trunk-recorder and watches it directly:
# journald for logs/decode rates, systemctl for unit state, udev for SDRs.

discord:
  token: ""             # or set the DISCORD_TOKEN environment variable
  alerts_channel_id: 0  # required: channel for watchdog alerts
  logs_channel_id: 0    # optional: channel for relayed log lines (0 = disabled)
  # Prepended to critical alerts (offline, SDR down, lost calls).
  #   "@everyone"              -> everyone who can see the alerts channel
  #   "@here"                  -> same, but only members currently online
  #   "<@&123456789012345678>" -> a specific role
  # The bot needs the "Mention @everyone, @here and All Roles" permission in
  # the alerts channel or the ping is silently suppressed.
  mention_on_critical: "@everyone"

systemd:
  # The trunk-recorder unit to watch. Drives online/offline alerts, restart /
  # crash-loop / failed-state detection (with journal excerpts attached), and
  # scopes the journal tail. Reading the journal requires the bot's user to
  # be in the systemd-journal group.
  unit: "trunk-recorder.service"
  poll_interval_s: 10
  journal_lines: 25             # journal lines attached to restart/offline alerts
  restart_window_s: 300         # restarts within this window count toward a crash loop
  restart_threshold: 3          # this many restarts in the window => crash-loop alert
  restart_alert_cooldown_s: 600 # min seconds between single-restart alerts
  # Command run by /trrestart ({unit} is substituted). The bot's user needs a
  # sudoers rule for exactly this command — see README. The slash command is
  # restricted to members with Manage Server by default (adjustable in
  # Server Settings -> Integrations) and requires confirm: True.
  restart_cmd: "sudo -n systemctl restart {unit}"

watchdog:
  # Decode-rate health, parsed from trunk-recorder's own log lines.
  # trunk-recorder logs the rate every ~3s when it is below controlWarnRate
  # (default 10); set controlWarnRate: -1 in trunk-recorder's config.json to
  # log it every ~3s always (also enables log-silence hang detection below).
  decode_rate_min: 3.0          # msg/s below this counts as unhealthy
  decode_rate_intervals: 10     # consecutive ~3s low updates before alerting (~30s)
  recovery_intervals: 3         # consecutive healthy updates before "recovered"
  decode_rate_clear_s: 30       # no low-rate lines for this long => recovered
                                # (needed with default controlWarnRate, where
                                # healthy systems log no rate lines at all)
  # Hang detection: alert if the unit is active but the journal goes silent.
  # Only enable after setting controlWarnRate: -1 in trunk-recorder's config,
  # otherwise a quiet system looks like a hung one. 0 = disabled.
  log_silence_timeout_s: 0      # e.g. 30
  upload_alert_cooldown_s: 600  # min seconds between upload-failure alerts per service
  realert_interval_s: 1800      # re-alert interval while a system stays down
  extra_upload_services: []     # add names here if you renamed uploader plugins in config.json

logs:
  min_severity: warning         # trace|debug|info|warning|error|fatal
  batch_interval_s: 5           # batch window for relayed log lines

activity:
  # Recording-activity watchdog. Conventional systems (analog or digital)
  # never log a decode rate — the only in-band sign of life is that calls
  # keep getting recorded. Alert when a system records nothing for longer
  # than max_quiet_hours (tune to the channel: a busy dispatch channel might
  # use 1-2h, a quiet tac channel 24h+). Also works for trunked systems as a
  # sanity check on top of decode rates. critical: true adds the
  # mention_on_critical ping. Timers reset when the bot or trunk-recorder
  # (re)starts.
  systems: []
  # systems:
  #   - system: "countyFD"        # shortName from trunk-recorder config.json
  #     max_quiet_hours: 6
  #     critical: false

usb:
  # SDRs to watch via udev. Find IDs with `lsusb` (ID 0bda:2838) and serials
  # via sysfs: for d in /sys/bus/usb/devices/*/; do cat $d/serial; done
  # (or rtl_eeprom). Empty list disables the watcher. serial is optional but
  # required in practice with multiple identical dongles.
  #
  # probe (optional): a command that opens the device at the driver level,
  # for /trprobe, crash-loop diagnosis, and verification after a reconnect.
  # The bot classifies the OUTPUT (ok / claimed / failed) because tools like
  # rtl_test exit 0 even when they fail to open the device. "claimed" is
  # healthy while trunk-recorder runs and an alert when it doesn't.
  # Examples for other hardware:
  #   Airspy:    probe: "airspy_info"
  #   HackRF:    probe: "hackrf_info"
  #   SoapySDR:  probe: "SoapySDRUtil --probe=driver=sdrplay"
  probe_timeout_s: 15
  devices:
    - label: "RTL-SDR Blog V4 #00000110"
      vendor_id: "0bda"
      product_id: "2838"
      serial: "00000110"
      probe: "rtl_test -d 00000110 -t"
    - label: "RTL-SDR Blog V4 #00000109"
      vendor_id: "0bda"
      product_id: "2838"
      serial: "00000109"
      probe: "rtl_test -d 00000109 -t"
